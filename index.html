<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>The Weekly Board</title>
<link rel="manifest" href="./manifest.json">
<meta name="theme-color" content="#242220">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Weekly Board">
<link rel="apple-touch-icon" href="./apple-touch-icon.png">
<link rel="icon" href="./icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;600;700&family=Inter:wght@400;500;600&family=IBM+Plex+Mono:wght@500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --charcoal:#242220;
    --charcoal-2:#2e2b28;
    --bone:#EDE6D6;
    --bone-dim:#c9c0ac;
    --ember:#B5482A;
    --ember-dim:#8f3a22;
    --sage:#7A8B6F;
    --mustard:#D9A62E;
    --ink:#1A1815;
    --line: rgba(237,230,214,0.14);
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    background:var(--charcoal);
    color:var(--bone);
    font-family:'Inter',sans-serif;
    -webkit-font-smoothing:antialiased;
  }
  .wrap{max-width:760px;margin:0 auto;padding:28px 18px 80px;}
  .hero{border-bottom:1px solid var(--line);padding-bottom:20px;margin-bottom:22px;}
  .eyebrow{
    font-family:'IBM Plex Mono',monospace;
    font-size:11px;letter-spacing:.12em;text-transform:uppercase;
    color:var(--mustard);margin:0 0 8px;
  }
  h1{
    font-family:'Oswald',sans-serif;
    font-weight:700;text-transform:uppercase;
    font-size:clamp(32px,7vw,48px);
    letter-spacing:.01em;margin:0 0 6px;line-height:1;
    color:var(--bone);
  }
  .sub{color:var(--bone-dim);font-size:14.5px;line-height:1.5;margin:0;max-width:520px;}
  .tabs{display:flex;flex-wrap:wrap;gap:8px;margin:22px 0 18px;}
  .tab{
    font-family:'IBM Plex Mono',monospace;
    font-size:12px;letter-spacing:.03em;text-transform:uppercase;
    padding:8px 13px;border-radius:3px;border:1px solid var(--line);
    background:transparent;color:var(--bone-dim);cursor:pointer;
    transition:all .15s ease;
  }
  .tab.active{background:var(--ember);border-color:var(--ember);color:var(--bone);}
  .tab:hover:not(.active){border-color:var(--bone-dim);color:var(--bone);}
  .search{
    width:100%;background:var(--charcoal-2);border:1px solid var(--line);
    color:var(--bone);padding:10px 12px;border-radius:3px;font-family:'Inter',sans-serif;
    font-size:14px;margin-bottom:22px;
  }
  .search::placeholder{color:var(--bone-dim);}
  .row{
    display:flex;align-items:center;gap:14px;
    padding:14px 4px;border-bottom:1px solid var(--line);
    cursor:pointer;
  }
  .row:hover .row-title{color:var(--mustard);}
  .row-num{
    font-family:'IBM Plex Mono',monospace;font-size:12px;color:var(--bone-dim);width:22px;flex-shrink:0;
  }
  .row-main{flex:1;min-width:0;}
  .row-title{
    font-family:'Oswald',sans-serif;font-weight:600;font-size:17px;
    text-transform:uppercase;letter-spacing:.01em;color:var(--bone);
    transition:color .15s ease;
  }
  .row-meta{font-size:12.5px;color:var(--bone-dim);margin-top:3px;}
  .tag{
    display:inline-block;font-family:'IBM Plex Mono',monospace;font-size:10.5px;
    letter-spacing:.03em;text-transform:uppercase;padding:2px 6px;border-radius:2px;
    margin-right:5px;border:1px solid var(--line);color:var(--bone-dim);
  }
  .tag.method{color:var(--mustard);border-color:rgba(217,166,46,0.35);}
  .row-macro{
    font-family:'IBM Plex Mono',monospace;font-size:12px;color:var(--sage);
    text-align:right;flex-shrink:0;white-space:nowrap;
  }
  .quick-add{
    flex-shrink:0;width:32px;height:32px;border-radius:50%;
    border:1px solid var(--line);background:transparent;color:var(--bone-dim);
    font-size:16px;line-height:1;cursor:pointer;
  }
  .quick-add.active{background:var(--sage);border-color:var(--sage);color:var(--ink);}
  .quick-add:hover:not(.active){border-color:var(--mustard);color:var(--mustard);}
  .empty{color:var(--bone-dim);text-align:center;padding:40px 0;font-size:14px;}

  /* Detail overlay */
  .overlay{
    position:fixed;inset:0;background:rgba(15,14,13,0.72);
    display:none;align-items:flex-start;justify-content:center;
    padding:24px 14px;overflow-y:auto;z-index:50;
  }
  .overlay.open{display:flex;}
  .card{
    background:var(--charcoal-2);border:1px solid var(--line);border-radius:6px;
    max-width:600px;width:100%;padding:26px 24px 30px;margin-top:10px;
  }
  .card-top{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;}
  .close{
    background:none;border:1px solid var(--line);color:var(--bone-dim);
    width:30px;height:30px;border-radius:50%;cursor:pointer;font-size:15px;flex-shrink:0;
  }
  .close:hover{color:var(--bone);border-color:var(--bone-dim);}
  .card h2{
    font-family:'Oswald',sans-serif;text-transform:uppercase;font-weight:700;
    font-size:26px;margin:0 0 6px;line-height:1.05;
  }
  .card .row-meta{margin-bottom:16px;}

  /* Dial */
  .dial-block{
    display:flex;align-items:center;gap:18px;background:var(--charcoal);
    border:1px solid var(--line);border-radius:6px;padding:16px;margin:18px 0 20px;
  }
  .dial{
    position:relative;width:64px;height:64px;border-radius:50%;
    border:3px solid var(--mustard);flex-shrink:0;
    display:flex;align-items:center;justify-content:center;
  }
  .dial::before{
    content:'';position:absolute;top:5px;left:50%;width:2px;height:12px;
    background:var(--mustard);transform-origin:bottom center;
    transform:translateX(-50%) rotate(var(--dial-rot,0deg));
    transition:transform .2s ease;
  }
  .dial-num{font-family:'Oswald',sans-serif;font-weight:700;font-size:22px;color:var(--bone);}
  .dial-controls{flex:1;}
  .dial-label{font-family:'IBM Plex Mono',monospace;font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--bone-dim);margin-bottom:6px;}
  .dial-steps{display:flex;gap:6px;}
  .dial-step{
    font-family:'IBM Plex Mono',monospace;font-size:13px;padding:5px 11px;border-radius:3px;
    border:1px solid var(--line);background:transparent;color:var(--bone-dim);cursor:pointer;
  }
  .dial-step.active{background:var(--sage);border-color:var(--sage);color:var(--ink);}
  .macro-strip{
    display:flex;gap:0;border:1px solid var(--line);border-radius:4px;overflow:hidden;margin:0 0 20px;
  }
  .macro-cell{flex:1;padding:10px 8px;text-align:center;border-right:1px solid var(--line);}
  .macro-cell:last-child{border-right:none;}
  .macro-val{font-family:'IBM Plex Mono',monospace;font-weight:600;font-size:16px;color:var(--bone);}
  .macro-key{font-size:10px;text-transform:uppercase;letter-spacing:.06em;color:var(--bone-dim);margin-top:2px;}
  .section-label{
    font-family:'IBM Plex Mono',monospace;font-size:11px;text-transform:uppercase;
    letter-spacing:.08em;color:var(--mustard);margin:20px 0 8px;
  }
  .ing-list{list-style:none;margin:0 0 4px;padding:0;font-size:14px;}
  .ing-list li{padding:6px 0;border-bottom:1px solid var(--line);display:flex;gap:8px;}
  .ing-amt{font-family:'IBM Plex Mono',monospace;color:var(--sage);min-width:64px;flex-shrink:0;}
  .steps{margin:0;padding-left:0;list-style:none;counter-reset:step;}
  .steps li{
    counter-increment:step;padding:9px 0 9px 30px;border-bottom:1px solid var(--line);
    position:relative;font-size:14px;line-height:1.5;color:var(--bone);
  }
  .steps li::before{
    content:counter(step);position:absolute;left:0;top:9px;
    font-family:'IBM Plex Mono',monospace;font-size:12px;color:var(--ember);border:1px solid var(--ember-dim);
    width:19px;height:19px;border-radius:50%;display:flex;align-items:center;justify-content:center;
  }
  .note{font-size:12.5px;color:var(--bone-dim);margin-top:14px;font-style:italic;}
  .del-btn{
    margin-top:20px;background:none;border:1px solid var(--ember-dim);color:var(--ember);
    font-family:'IBM Plex Mono',monospace;font-size:11px;text-transform:uppercase;
    padding:7px 12px;border-radius:3px;cursor:pointer;letter-spacing:.05em;
  }
  .del-btn:hover{background:var(--ember-dim);color:var(--bone);}

  /* Add form */
  .add-toggle{
    width:100%;background:transparent;border:1px dashed var(--bone-dim);color:var(--bone-dim);
    font-family:'IBM Plex Mono',monospace;font-size:12px;text-transform:uppercase;letter-spacing:.05em;
    padding:14px;border-radius:4px;cursor:pointer;margin-top:24px;
  }
  .add-toggle:hover{color:var(--bone);border-color:var(--bone);}
  .add-form{display:none;margin-top:16px;background:var(--charcoal-2);border:1px solid var(--line);border-radius:6px;padding:20px;}
  .add-form.open{display:block;}
  .field{margin-bottom:12px;}
  .field label{display:block;font-family:'IBM Plex Mono',monospace;font-size:10.5px;text-transform:uppercase;letter-spacing:.06em;color:var(--bone-dim);margin-bottom:5px;}
  .field input, .field select, .field textarea{
    width:100%;background:var(--charcoal);border:1px solid var(--line);color:var(--bone);
    padding:8px 10px;border-radius:3px;font-family:'Inter',sans-serif;font-size:13.5px;
  }
  .field-row{display:flex;gap:10px;}
  .field-row .field{flex:1;}
  .ing-row{display:flex;gap:8px;margin-bottom:8px;}
  .ing-row input:nth-child(1){width:70px;flex:0 0 70px;}
  .ing-row input:nth-child(2){width:70px;flex:0 0 70px;}
  .ing-row input:nth-child(3){flex:1;}
  .ing-row button{background:none;border:1px solid var(--line);color:var(--bone-dim);border-radius:3px;padding:0 10px;cursor:pointer;}
  .small-btn{
    background:none;border:1px solid var(--line);color:var(--bone-dim);font-family:'IBM Plex Mono',monospace;
    font-size:11px;padding:6px 10px;border-radius:3px;cursor:pointer;margin-bottom:12px;
  }
  .small-btn:hover{color:var(--bone);}
  .submit-btn{
    background:var(--ember);border:none;color:var(--bone);font-family:'Oswald',sans-serif;
    text-transform:uppercase;font-weight:600;letter-spacing:.03em;font-size:14px;
    padding:11px 20px;border-radius:4px;cursor:pointer;width:100%;margin-top:6px;
  }
  .submit-btn:hover{background:var(--ember-dim);}
  .msg{font-size:12px;color:var(--sage);margin-top:8px;min-height:16px;}
  ::-webkit-scrollbar{width:8px;}
  ::-webkit-scrollbar-thumb{background:var(--line);border-radius:4px;}

  .week-strip{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin:-6px 0 18px;padding:12px;background:var(--charcoal-2);border:1px solid var(--line);border-radius:6px;}
  .week-chip{font-family:'IBM Plex Mono',monospace;font-size:11.5px;color:var(--bone-dim);border:1px solid var(--line);border-radius:3px;padding:4px 8px;}
  .cart-btn{
    font-family:'Oswald',sans-serif;font-weight:600;text-transform:uppercase;font-size:13px;letter-spacing:.02em;
    background:var(--mustard);color:var(--ink);border:none;padding:8px 14px;border-radius:4px;cursor:pointer;margin-left:auto;
  }
  .cart-btn:hover{background:#e8b53a;}
  .plan-btn{
    font-family:'IBM Plex Mono',monospace;font-size:12px;text-transform:uppercase;letter-spacing:.03em;
    background:transparent;border:1px solid var(--sage);color:var(--sage);padding:9px 14px;border-radius:4px;cursor:pointer;width:100%;margin-top:2px;
  }
  .plan-btn.active{background:var(--sage);color:var(--ink);}
  .shop-list{list-style:none;margin:0 0 18px;padding:0;}
  .shop-item{display:flex;align-items:center;gap:10px;padding:9px 2px;border-bottom:1px solid var(--line);font-size:14px;cursor:pointer;}
  .shop-item input{width:16px;height:16px;flex-shrink:0;}
  .shop-item.checked span{color:var(--bone-dim);text-decoration:line-through;}
  .shop-row-top{display:flex;justify-content:space-between;gap:10px;}
  .shop-cost{font-family:'IBM Plex Mono',monospace;color:var(--sage);flex-shrink:0;}
  .leftover-note{font-size:11px;color:var(--mustard);margin-top:2px;}
  .export-row{display:flex;gap:10px;margin:4px 0 6px;}
  .export-btn{
    flex:1;font-family:'Oswald',sans-serif;font-weight:600;text-transform:uppercase;font-size:13px;letter-spacing:.02em;
    background:var(--mustard);color:var(--ink);border:none;padding:11px 10px;border-radius:4px;cursor:pointer;
  }
  .export-btn:hover{background:#e8b53a;}
  .export-msg{font-size:12px;color:var(--sage);min-height:16px;margin-bottom:6px;}
  .buy-note{font-size:11px;color:var(--bone-dim);margin-top:2px;}
  .synergy-block{background:var(--charcoal);border:1px solid var(--line);border-radius:5px;padding:10px 12px;margin:0 0 18px;font-size:12.5px;color:var(--bone-dim);}
  .synergy-block b{color:var(--sage);}
</style>
</head>
<body>
<div class="wrap">
  <div class="hero">
    <p class="eyebrow">Grill · Air Fryer · Stovetop · Sunday Batch</p>
    <h1>The Weekly Board</h1>
    <p class="sub">Your saved rotation. Cook 2 on weeknights, batch 4 on Sundays. Dial the servings on any recipe to see real per-portion macros — no shellfish, ever.</p>
  </div>

  <div class="tabs" id="tabs"></div>
  <input class="search" id="search" placeholder="Search recipes, proteins, tags…">
  <div class="week-strip" id="weekStrip" style="display:none;"></div>
  <div id="list"></div>

  <button class="add-toggle" id="addToggle">+ Add a recipe to the board</button>
  <div class="add-form" id="addForm">
    <div class="field-row">
      <div class="field"><label>Title</label><input id="f-title" placeholder="e.g. Miso Air Fryer Chicken"></div>
      <div class="field"><label>Method</label>
        <select id="f-method">
          <option value="bbq">BBQ</option>
          <option value="airfryer">Air Fryer</option>
          <option value="stovetop">Stovetop</option>
          <option value="oven">Oven</option>
          <option value="batch">Sunday Batch</option>
        </select>
      </div>
    </div>
    <div class="field-row">
      <div class="field"><label>Protein</label><input id="f-protein" placeholder="e.g. Chicken"></div>
      <div class="field"><label>Base servings</label>
        <select id="f-base"><option value="2">2</option><option value="4">4</option></select>
      </div>
    </div>
    <div class="field-row">
      <div class="field"><label>Calories / portion</label><input id="f-cal" type="number" placeholder="420"></div>
      <div class="field"><label>Protein g / portion</label><input id="f-prot" type="number" placeholder="38"></div>
    </div>
    <div class="field-row">
      <div class="field"><label>Carbs g / portion</label><input id="f-carb" type="number" placeholder="30"></div>
      <div class="field"><label>Fat g / portion</label><input id="f-fat" type="number" placeholder="16"></div>
    </div>
    <div class="field"><label>Total active + cook time</label><input id="f-time" placeholder="e.g. 25 min"></div>

    <label style="font-family:'IBM Plex Mono',monospace;font-size:10.5px;text-transform:uppercase;letter-spacing:.06em;color:var(--bone-dim);display:block;margin:14px 0 6px;">Ingredients (for base servings)</label>
    <div id="ingRows"></div>
    <button type="button" class="small-btn" id="addIngRow">+ add ingredient</button>

    <label style="font-family:'IBM Plex Mono',monospace;font-size:10.5px;text-transform:uppercase;letter-spacing:.06em;color:var(--bone-dim);display:block;margin:6px 0 6px;">Steps (one per line)</label>
    <div class="field"><textarea id="f-steps" rows="4" placeholder="Season chicken with salt, pepper, garlic.&#10;Air fry at 200°C for 18 min, flipping once.&#10;Rest 5 min, slice, serve."></textarea></div>

    <button class="submit-btn" id="saveRecipe">Save to board</button>
    <div class="msg" id="saveMsg"></div>
  </div>
</div>

<div class="overlay" id="overlay">
  <div class="card" id="cardBody"></div>
</div>

// --- Standalone app storage shim ---
// Replaces the Claude-artifact window.storage API with real browser localStorage,
// which is reliable and persists across app closes/reopens (unlike the artifact sandbox).
window.storage = {
  async get(key, shared){
    const raw = localStorage.getItem('wb:' + key);
    if(raw === null) throw new Error('Key not found: ' + key);
    return { key, value: raw, shared: !!shared };
  },
  async set(key, value, shared){
    localStorage.setItem('wb:' + key, value);
    return { key, value, shared: !!shared };
  },
  async delete(key, shared){
    const existed = localStorage.getItem('wb:' + key) !== null;
    localStorage.removeItem('wb:' + key);
    return { key, deleted: existed, shared: !!shared };
  },
  async list(prefix, shared){
    const full = 'wb:' + (prefix || '');
    const keys = [];
    for(let i=0;i<localStorage.length;i++){
      const k = localStorage.key(i);
      if(k && k.startsWith(full)) keys.push(k.slice(3));
    }
    return { keys, prefix, shared: !!shared };
  }
};

// Register service worker for offline support (no-op if unsupported)
if('serviceWorker' in navigator){
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('./service-worker.js').catch(()=>{});
  });
}

function convertAmount(ing){
  const ref = PRICE_REF[ing.k];
  if(!ref) return {qty:ing.a, unit:ing.u||''};
  const factor = ref.conv[ing.u||''] ?? ref.conv[''] ?? 1;
  return {qty: ing.a * factor, unit: ref.unit};
}

  catch(e){ weekPlan = {}; }

  render();
}
async function storageSetWithRetry(key, value, attempts=3){
  let lastErr;
  for(let i=0;i<attempts;i++){
    try{
      const result = await window.storage.set(key, value, false);
      if(result) return result;
      lastErr = new Error('empty response');
    }catch(e){ lastErr = e; }
    await new Promise(r=>setTimeout(r, 300*(i+1)));
  }
  throw lastErr;
}

async function saveWeekPlan(){

    await storageSetWithRetry('weekPlan', JSON.stringify(weekPlan));
  }catch(e){ console.error('weekPlan save failed', e); showSaveWarning('Week plan failed to save after retries: '+e.message); }

function aggregateIngredients(){
  const map = {}; // canonical key -> {names:Set, qty, unit}
  Object.entries(weekPlan).forEach(([id,serv])=>{
    const r = recipes.find(x=>x.id===id);
    if(!r) return;
    const factor = serv / r.baseServings;
    r.ingredients.forEach(ing=>{
      const key = ing.k || ('other_'+ing.n.toLowerCase());
      const {qty, unit} = convertAmount(ing);
      if(!map[key]) map[key] = {names:new Set(), qty:0, unit};
      map[key].qty += qty*factor;
      map[key].names.add(ing.n);
    });
  });
  return Object.entries(map).map(([key,v])=>{
    const ref = PRICE_REF[key];
    const label = ref ? ref.label : Array.from(v.names)[0];
    let packsNeeded=null, leftover=0, cost=0, mode='loose';
    if(ref){
      mode = ref.mode;
      if(ref.mode==='pack'){
        packsNeeded = Math.max(1, Math.ceil((v.qty - 1e-6) / ref.pack));
        leftover = packsNeeded*ref.pack - v.qty;
        cost = packsNeeded*ref.price;
      } else if(ref.unit==='count'){
        const count = Math.ceil(v.qty - 1e-6);
        cost = count*ref.price;
      } else { // kg, tsp, tbsp, ml loose
        cost = v.qty*ref.price;
      }
    }
    // which other planned recipes also use this key
    const usedIn = Object.keys(weekPlan)
      .map(id=>recipes.find(x=>x.id===id))
      .filter(r=>r && r.ingredients.some(ing=>(ing.k||'')===key));
    return {key, label, qty:v.qty, unit:v.unit, ref, mode, packsNeeded, leftover, cost, usedIn};
  }).sort((a,b)=>{
    const catA = a.ref && a.ref.cat==='perishable' ? 0 : 1;
    const catB = b.ref && b.ref.cat==='perishable' ? 0 : 1;
    return catA-catB || a.label.localeCompare(b.label);
  });
}

function shoppingListHtml(items){
  const recipeCount = Object.keys(weekPlan).length;
  const total = items.reduce((s,it)=>s+it.cost, 0);
  const remaining = items.reduce((s,it)=>s+(checkedItems[it.key]?0:it.cost), 0);
  const rows = items.map(it=>{
    const isChecked = !!checkedItems[it.key];
    const neededLabel = it.unit==='count'
      ? `${round2(it.qty)}`
      : `${round2(it.qty)}${it.unit}`;
    let buyHtml = '';
    if(it.mode==='pack'){
      buyHtml = `<div class="buy-note">Buy: ${it.packsNeeded} × ${it.ref.pack}${it.ref.unit} pack</div>`;
    } else if(it.unit==='count'){
      buyHtml = `<div class="buy-note">Buy: ${Math.ceil(it.qty-1e-6)}</div>`;
    }
    let leftoverHtml = '';
    if(it.mode==='pack' && it.leftover > 0.5 && it.ref.cat==='perishable'){
      const others = it.usedIn.slice(0,2).map(r=>escapeHtml(r.title));
      leftoverHtml = `<div class="leftover-note">~${round2(it.leftover)}${it.ref.unit} left over${others.length?(' — also used in: '+others.join(', ')):''}</div>`;
    }
    return `<li class="shop-item ${isChecked?'checked':''}" data-key="${escapeHtml(it.key)}" data-cost="${it.cost}">
      <input type="checkbox" ${isChecked?'checked':''}>
      <div style="flex:1;">
        <div class="shop-row-top"><span>${neededLabel} ${escapeHtml(it.label)}</span><span class="shop-cost">£${it.cost.toFixed(2)}</span></div>
        ${buyHtml}
        ${leftoverHtml}
      </div>
    </li>`;
  }).join('');
  return `
    <div class="card-top">
      <h2>Shopping List</h2>
      <button class="close" id="closeCard">✕</button>
    </div>
    <div class="row-meta" style="margin-bottom:10px;">${items.length} item${items.length!==1?'s':''} across ${recipeCount} recipe${recipeCount!==1?'s':''}</div>
    <div class="macro-strip" style="margin-bottom:16px;">
      <div class="macro-cell"><div class="macro-val">£${total.toFixed(2)}</div><div class="macro-key">Full total</div></div>
      <div class="macro-cell"><div class="macro-val" id="remainingTotal">£${remaining.toFixed(2)}</div><div class="macro-key">Left to buy</div></div>
    </div>
    <div class="row-meta" style="margin:-8px 0 12px;">Bold amount is what the recipes need — use that at any store. "Buy" line is Aldi's pack size. Tick items off as you shop — "Left to buy" updates live.</div>
    <ul class="shop-list">${rows || '<li class="shop-item">Nothing planned yet.</li>'}</ul>
    <div class="note">Prices are approximate Aldi UK estimates, not live pricing — treat as a rough guide.</div>
    <div class="export-row">
      <button class="export-btn" id="saveListFile">Save as file</button>
      <button class="export-btn" id="shareListText">Share / copy</button>
    </div>
    <div class="export-msg" id="exportMsg"></div>
    <button class="del-btn" id="clearPlan">Clear week plan</button>
  `;
}

function buildListText(){
  const items = aggregateIngredients();
  const toBuy = items.filter(it=>!checkedItems[it.key]);
  const have = items.filter(it=>checkedItems[it.key]);
  const line = (it, box)=>{
    const tight = /^(g|kg|ml|l)$/.test(it.unit);
    const needed = it.unit==='count' ? `${round2(it.qty)}` : `${round2(it.qty)}${tight?'':' '}${it.unit}`;
    let s = `${box} ${needed} ${it.label}`;
    if(it.mode==='pack') s += it.ref.unit==='count'
      ? ` (buy ${it.packsNeeded} pack${it.packsNeeded>1?'s':''})`
      : ` (buy ${it.packsNeeded} x ${it.ref.pack}${it.ref.unit})`;
    else if(it.unit==='count') s += ` (buy ${Math.ceil(it.qty-1e-6)})`;
    return s + ` - £${it.cost.toFixed(2)}`;
  };
  const remaining = toBuy.reduce((s,it)=>s+it.cost, 0);
  const planned = Object.keys(weekPlan).map(id=>{
    const r = recipes.find(x=>x.id===id);
    return r ? `- ${r.title} (${weekPlan[id]} portions)` : null;
  }).filter(Boolean);
  let out = 'SHOPPING LIST - The Weekly Board\n\nRecipes this week:\n' + planned.join('\n');
  out += '\n\nTO BUY\n' + (toBuy.map(it=>line(it,'[ ]')).join('\n') || '(nothing left to buy)');
  out += `\n\nEstimated cost of remaining items: £${remaining.toFixed(2)} (approx. Aldi UK prices)\n`;
  if(have.length){
    out += '\nALREADY HAVE / BOUGHT\n' + have.map(it=>line(it,'[x]')).join('\n') + '\n';
  }
  return out;
}

function setExportMsg(m){
  const el = document.getElementById('exportMsg');
  if(el) el.textContent = m;
}

async function saveListAsFile(){
  const text = buildListText();
  try{
    const file = new File([text], 'shopping-list.txt', {type:'text/plain'});
    if(navigator.canShare && navigator.canShare({files:[file]})){
      await navigator.share({files:[file], title:'Shopping list'});
      setExportMsg('Choose "Save to Files" to keep it on your phone.');
      return;
    }
  }catch(e){
    if(e && e.name==='AbortError') return;
  }
  const blob = new Blob([text], {type:'text/plain'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = 'shopping-list.txt';
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(()=>URL.revokeObjectURL(url), 1500);
  setExportMsg('Downloaded shopping-list.txt');
}

async function shareListText(){
  const text = buildListText();
  try{
    if(navigator.share){
      await navigator.share({title:'Shopping list', text});
      return;
    }
  }catch(e){
    if(e && e.name==='AbortError') return;
  }
  try{
    await navigator.clipboard.writeText(text);
    setExportMsg('List copied - paste it into Notes or Messages.');
  }catch(e){
    setExportMsg('Could not copy - try Save as file instead.');
  }
}

function updateRemainingTotal(){
  const items = document.querySelectorAll('.shop-item[data-key]');
  let remaining = 0;
  items.forEach(li=>{
    if(!li.classList.contains('checked')) remaining += parseFloat(li.dataset.cost) || 0;
  });
  const el = document.getElementById('remainingTotal');
  if(el) el.textContent = '£' + remaining.toFixed(2);
}

function bindShoppingList(){
  document.getElementById('closeCard').addEventListener('click', closeCard);
  document.querySelectorAll('.shop-item[data-key]').forEach(li=>{
    li.addEventListener('click', async (e)=>{
      if(e.target.tagName==='INPUT') return;
      const key = li.dataset.key;
      checkedItems[key] = !checkedItems[key];
      li.classList.toggle('checked', checkedItems[key]);
      const box = li.querySelector('input'); if(box) box.checked = checkedItems[key];
      updateRemainingTotal();
      await saveChecked();
    });
    const box = li.querySelector('input');
    if(box) box.addEventListener('change', async ()=>{
      const key = li.dataset.key;
      checkedItems[key] = box.checked;
      li.classList.toggle('checked', checkedItems[key]);
      updateRemainingTotal();
      await saveChecked();
    });
  });
  const saveBtn = document.getElementById('saveListFile');
  if(saveBtn) saveBtn.addEventListener('click', saveListAsFile);
  const shareBtn = document.getElementById('shareListText');
  if(shareBtn) shareBtn.addEventListener('click', shareListText);
  const clearBtn = document.getElementById('clearPlan');
  if(clearBtn) clearBtn.addEventListener('click', async ()=>{
    if(!confirm('Clear your entire week plan and shopping list?')) return;
    weekPlan = {}; checkedItems = {};
    await saveWeekPlan(); await saveChecked();
    closeCard();
    renderWeekStrip();
  });
}

function computeSynergy(recipe){
  const myKeys = new Set(recipe.ingredients.map(i=>i.k));
  const scores = recipes.filter(r=>r.id!==recipe.id).map(r=>{
    const shared = r.ingredients.filter(i=>myKeys.has(i.k)).map(i=>i.k);
    const uniqueShared = new Set(shared);
    return {title:r.title, count:uniqueShared.size};
  }).filter(s=>s.count>0).sort((a,b)=>b.count-a.count);
  return scores.slice(0,3);
}

async function loadRecipes(){
  let stored = null;
  try{
    const res = await window.storage.get('recipes', false);
    stored = res && res.value ? JSON.parse(res.value) : null;
  }catch(e){ stored = null; }

  if(!stored){
    // first ever load
    recipes = SEED.map(r=>({...r}));
    const seedVersions = {};
    SEED.forEach(r=> seedVersions[r.id] = r.v||1);
    await persist();
    try{ await window.storage.set('seedVersions', JSON.stringify(seedVersions), false); }catch(e){}
    render();
    return;
  }

  let seedVersions = {};
  try{
    const svRes = await window.storage.get('seedVersions', false);
    seedVersions = svRes && svRes.value ? JSON.parse(svRes.value) : {};
  }catch(e){ seedVersions = {}; }

  let changed = false;
  SEED.forEach(seedRecipe=>{
    const sv = seedRecipe.v || 1;
    const knownV = seedVersions[seedRecipe.id];
    const idx = stored.findIndex(r=>r.id===seedRecipe.id);
    if(knownV === undefined){
      // never seen this seed id before
      if(idx === -1){
        stored.push({...seedRecipe});
        changed = true;
      }
      seedVersions[seedRecipe.id] = sv;
      changed = true;
    } else if(sv > knownV){
      if(idx !== -1){
        stored[idx] = {...seedRecipe};
        changed = true;
      }
      // if idx === -1, user removed it on purpose — don't resurrect, but still record the new version
      seedVersions[seedRecipe.id] = sv;
      changed = true;
    }
  });

  recipes = stored;
  if(changed){
    await persist();
    try{ await window.storage.set('seedVersions', JSON.stringify(seedVersions), false); }catch(e){}
  }
  render();
}

async function persist(){
  try{ await storageSetWithRetry('recipes', JSON.stringify(recipes)); }
  catch(e){ console.error('storage save failed', e); }
}

function renderTabs(){
  const tabsEl = document.getElementById('tabs');
  const methods = ['all','bbq','airfryer','stovetop','oven','batch'];
  tabsEl.innerHTML = methods.map(m=>{
    const label = m==='all' ? 'All' : METHOD_LABELS[m];
    return `<button class="tab ${activeMethod===m?'active':''}" data-method="${m}">${label}</button>`;
  }).join('');
  tabsEl.querySelectorAll('.tab').forEach(btn=>{
    btn.addEventListener('click', ()=>{ activeMethod = btn.dataset.method; render(); });
  });
}

function filtered(){
  return recipes.filter(r=>{
    const methodOk = activeMethod==='all' || r.method===activeMethod;
    const term = searchTerm.trim().toLowerCase();
    const searchOk = !term || (r.title+' '+r.protein+' '+METHOD_LABELS[r.method]).toLowerCase().includes(term);
    return methodOk && searchOk;
  });
}

function render(){
  renderTabs();
  const list = document.getElementById('list');
  const items = filtered();
  if(items.length===0){
    list.innerHTML = '<div class="empty">Nothing here yet. Try another tab, or add a recipe below.</div>';
    return;
  }
  list.innerHTML = items.map((r,i)=>{
    const inPlan = weekPlan[r.id] !== undefined;
    return `<div class="row" data-id="${r.id}">
      <div class="row-num">${String(i+1).padStart(2,'0')}</div>
      <div class="row-main">
        <div class="row-title">${escapeHtml(r.title)}</div>
        <div class="row-meta"><span class="tag method">${METHOD_LABELS[r.method]}</span><span class="tag">${escapeHtml(r.protein)}</span><span class="tag">${escapeHtml(r.time||'')}</span></div>
      </div>
      <div class="row-macro">${r.macros.cal} kcal<br>${r.macros.prot}g protein</div>
      <button class="quick-add ${inPlan?'active':''}" data-quickid="${r.id}" title="${inPlan?'Remove from week':'Add to week'}">${inPlan?'✓':'+'}</button>
    </div>`;
  }).join('');
  list.querySelectorAll('.row').forEach(row=>{
    row.addEventListener('click', (e)=>{
      if(e.target.closest('.quick-add')) return;
      openCard(row.dataset.id);
    });
  });
  list.querySelectorAll('.quick-add').forEach(btn=>{
    btn.addEventListener('click', async (e)=>{
      e.stopPropagation();
      const id = btn.dataset.quickid;
      const r = recipes.find(x=>x.id===id);
      if(!r) return;
      if(weekPlan[id] !== undefined){ delete weekPlan[id]; }
      else{ weekPlan[id] = dialServings[id] || r.baseServings; }
      await saveWeekPlan();
      renderWeekStrip();
      render();
    });
  });
}

function escapeHtml(s){
  return (s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}

const DIAL_STEPS = [1,2,3,4,6];
const DIAL_ROT = {1:-60,2:-30,3:0,4:30,6:60};

function openCard(id){
  const r = recipes.find(x=>x.id===id);
  if(!r) return;
  const serv = dialServings[id] || r.baseServings;
  dialServings[id] = serv;
  document.getElementById('cardBody').innerHTML = cardHtml(r, serv);
  document.getElementById('overlay').classList.add('open');
  bindCard(r);
}

function cardHtml(r, serv){
  const factor = serv / r.baseServings;
  const ingHtml = r.ingredients.map(ing=>{
    const amt = round2(ing.a * factor);
    return `<li><span class="ing-amt">${amt}${ing.u?(' '+ing.u):''}</span>${escapeHtml(ing.n)}</li>`;
  }).join('');
  const stepsHtml = r.steps.map(s=>`<li>${escapeHtml(s)}</li>`).join('');
  return `
    <div class="card-top">
      <div>
        <div class="row-meta" style="margin-bottom:8px;"><span class="tag method">${METHOD_LABELS[r.method]}</span><span class="tag">${escapeHtml(r.protein)}</span></div>
        <h2>${escapeHtml(r.title)}</h2>
        <div class="row-meta">${escapeHtml(r.time||'')}</div>
      </div>
      <button class="close" id="closeCard">✕</button>
    </div>

    <div class="dial-block">
      <div class="dial"><div class="dial-num" id="dialNum">${serv}</div></div>
      <div class="dial-controls">
        <div class="dial-label">Servings on the board</div>
        <div class="dial-steps" id="dialSteps">
          ${DIAL_STEPS.map(s=>`<button class="dial-step ${s===serv?'active':''}" data-serv="${s}">${s}</button>`).join('')}
        </div>
      </div>
    </div>

    <div class="macro-strip">
      <div class="macro-cell"><div class="macro-val">${r.macros.cal}</div><div class="macro-key">kcal / portion</div></div>
      <div class="macro-cell"><div class="macro-val">${r.macros.prot}g</div><div class="macro-key">protein</div></div>
      <div class="macro-cell"><div class="macro-val">${r.macros.carb}g</div><div class="macro-key">carbs</div></div>
      <div class="macro-cell"><div class="macro-val">${r.macros.fat}g</div><div class="macro-key">fat</div></div>
    </div>

    <div class="section-label">Ingredients — scaled to ${serv} portion${serv>1?'s':''}</div>
    <ul class="ing-list">${ingHtml}</ul>
    ${synergyHtml(r)}

    <div class="section-label">Method</div>
    <ol class="steps">${stepsHtml}</ol>

    ${r.note ? `<div class="note">${escapeHtml(r.note)}</div>` : ''}
    <div class="note" style="margin-top:6px;">Macros are approximate estimates, not lab-verified values.</div>
    <button class="plan-btn ${weekPlan[r.id]!==undefined?'active':''}" id="planBtn">${weekPlan[r.id]!==undefined ? ('Remove from Week ('+weekPlan[r.id]+' portions)') : ('Add to Week ('+serv+' portions)')}</button>
    <button class="del-btn" id="delRecipe">Remove from board</button>
  `;
}

function synergyHtml(recipe){
  const matches = computeSynergy(recipe);
  if(matches.length===0) return '';
  const list = matches.map(m=>`<b>${m.count}</b> with ${escapeHtml(m.title)}`).join(' · ');
  return `<div class="synergy-block">Shares ingredients: ${list}</div>`;
}

function round2(n){

  const r = Math.round(n*10)/10;
  return r % 1 === 0 ? r.toFixed(0) : r.toFixed(1);
}

function bindCard(r){
  document.getElementById('closeCard').addEventListener('click', closeCard);
  document.getElementById('planBtn').addEventListener('click', async ()=>{
    const serv = dialServings[r.id] || r.baseServings;
    if(weekPlan[r.id] !== undefined){ delete weekPlan[r.id]; }
    else{ weekPlan[r.id] = serv; }
    await saveWeekPlan();
    renderWeekStrip();
    document.getElementById('cardBody').innerHTML = cardHtml(r, serv);
    bindCard(r);
  });
  document.getElementById('dialSteps').querySelectorAll('.dial-step').forEach(btn=>{
    btn.addEventListener('click', ()=>{
      const serv = parseInt(btn.dataset.serv,10);
      dialServings[r.id] = serv;
      document.getElementById('cardBody').innerHTML = cardHtml(r, serv);
      bindCard(r);
    });
  });
  document.getElementById('delRecipe').addEventListener('click', async ()=>{
    if(!confirm('Remove "'+r.title+'" from the board?')) return;
    recipes = recipes.filter(x=>x.id!==r.id);
    await persist();
    closeCard();
    render();
  });
}

function closeCard(){
  document.getElementById('overlay').classList.remove('open');
}

document.getElementById('overlay').addEventListener('click', (e)=>{
  if(e.target.id==='overlay') closeCard();
});

document.getElementById('search').addEventListener('input', (e)=>{
  searchTerm = e.target.value;
  render();
});

document.getElementById('addToggle').addEventListener('click', ()=>{
  document.getElementById('addForm').classList.toggle('open');
});

function addIngRow(){
  const div = document.createElement('div');
  div.className = 'ing-row';
  div.innerHTML = `<input placeholder="amt" type="number" step="any"><input placeholder="unit"><input placeholder="ingredient name"><button type="button">✕</button>`;
  div.querySelector('button').addEventListener('click', ()=> div.remove());
  document.getElementById('ingRows').appendChild(div);
}
document.getElementById('addIngRow').addEventListener('click', addIngRow);
addIngRow(); addIngRow(); addIngRow();

document.getElementById('saveRecipe').addEventListener('click', async ()=>{
  const title = document.getElementById('f-title').value.trim();
  const method = document.getElementById('f-method').value;
  const protein = document.getElementById('f-protein').value.trim();
  const base = parseInt(document.getElementById('f-base').value,10);
  const cal = parseFloat(document.getElementById('f-cal').value)||0;
  const prot = parseFloat(document.getElementById('f-prot').value)||0;
  const carb = parseFloat(document.getElementById('f-carb').value)||0;
  const fat = parseFloat(document.getElementById('f-fat').value)||0;
  const time = document.getElementById('f-time').value.trim();
  const stepsRaw = document.getElementById('f-steps').value.trim();
  const msg = document.getElementById('saveMsg');

  if(!title || !stepsRaw){
    msg.textContent = 'Add at least a title and steps.';
    msg.style.color = 'var(--ember)';
    return;
  }
  const ingredients = [];
  document.getElementById('ingRows').querySelectorAll('.ing-row').forEach(row=>{
    const inputs = row.querySelectorAll('input');
    const a = parseFloat(inputs[0].value);
    const u = inputs[1].value.trim();
    const n = inputs[2].value.trim();
    if(n) ingredients.push({a: isNaN(a)?1:a, u, n});
  });
  const steps = stepsRaw.split('\n').map(s=>s.trim()).filter(Boolean);
  const id = 'custom-' + Date.now();

  recipes.push({id, title, method, protein: protein||'—', baseServings: base, time,
    macros:{cal,prot,carb,fat}, ingredients, steps, note:''});
  await persist();
  msg.textContent = 'Saved to your board.';
  msg.style.color = 'var(--sage)';
  ['f-title','f-protein','f-cal','f-prot','f-carb','f-fat','f-time','f-steps'].forEach(id=>document.getElementById(id).value='');
  document.getElementById('ingRows').innerHTML='';
  addIngRow(); addIngRow(); addIngRow();
  render();
  setTimeout(()=>{ msg.textContent=''; }, 2500);
});

loadRecipes();
loadWeekPlan();
if(typeof window.storage === 'undefined'){
  showSaveWarning('Storage isn\'t available here — your week plan won\'t be saved between sessions.');
}
</script>
